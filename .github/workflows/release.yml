name: Tagged Release

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"          # full release: Docker image + desktop installers
    - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"   # server hotfix: Docker image only (vpk needs 3-part SemVer)
  # Dry run from the Actions tab: builds the Windows and macOS desktop packages and
  # uploads them as workflow artifacts. No Docker image is pushed and no Release is made.
  workflow_dispatch:
    inputs:
      version:
        description: "3-part version stamped on the dry-run build"
        required: true
        default: "0.0.1"

permissions:
  contents: write   # create the GitHub Release and upload desktop assets
  packages: write   # push the Docker image to GHCR

jobs:
  # ---------------------------------------------------------------------------
  # Classify the tag. Desktop builds (Velopack) require a 3-part SemVer version,
  # so a 4-part tag (e.g. v1.2.3.4) ships only the server Docker image.
  # ---------------------------------------------------------------------------
  classify-tag:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.classify.outputs.desktop }}
      version: ${{ steps.classify.outputs.version }}
    steps:
    - name: Check tag part count
      id: classify
      env:
        DRY_RUN_VERSION: ${{ inputs.version }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          ver="$DRY_RUN_VERSION"
        else
          ver="${GITHUB_REF_NAME#v}"
        fi
        echo "version=$ver" >> "$GITHUB_OUTPUT"
        parts=$(echo "$ver" | awk -F. '{print NF}')
        if [ "$parts" -eq 3 ]; then desktop=true; else desktop=false; fi
        echo "Version $ver has $parts parts; desktop builds: $desktop"
        echo "desktop=$desktop" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Server image -> GHCR (unchanged behavior). Independent of the desktop builds.
  # ---------------------------------------------------------------------------
  build-docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract tag
      id: extract_tag
      run: echo "::set-output name=tag::${GITHUB_REF#refs/tags/}"

    - name: Convert repository name to lowercase
      id: to_lowercase
      run: echo "::set-output name=lower_repo::${GITHUB_REPOSITORY,,}"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Server/Dockerfile
        push: true
        build-args: |
          TAG_NAME=${{ steps.extract_tag.outputs.tag }}
        tags: |
          ghcr.io/${{ steps.to_lowercase.outputs.lower_repo }}:${{ steps.extract_tag.outputs.tag }}
          ghcr.io/${{ steps.to_lowercase.outputs.lower_repo }}:latest

  # ---------------------------------------------------------------------------
  # Windows desktop (MAUI) -> Velopack one-click installer + auto-update feed.
  # Builds x64 and arm64. Uploads the output as a CI artifact (no Release yet).
  # ---------------------------------------------------------------------------
  build-windows:
    needs: classify-tag
    if: needs.classify-tag.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Pin the .NET 10 SDK
      # The repo's global.json ("10.0.*") is not a valid pin, so a newer SDK on the
      # image would be used and install that SDK's MAUI workload. Pin the SDK that
      # setup-dotnet just installed so the workload and publish match .NET 10.
      shell: bash
      run: |
        sdk=$(dotnet --list-sdks | awk '/^10\./{print $1}' | tail -n1)
        echo "Pinning SDK $sdk"
        dotnet new globaljson --sdk-version "$sdk" --force

    - name: Install .NET MAUI workload
      run: dotnet workload install maui

    - name: Install Velopack CLI (vpk)
      run: dotnet tool install -g vpk

    - name: Build Velopack installers (x64 + arm64)
      shell: pwsh
      run: |
        $ver = "${{ needs.classify-tag.outputs.version }}"      # 3-part SemVer, e.g. 1.2.3
        foreach ($rid in @('win-x64','win-arm64')) {
          Write-Host "=== Publishing $rid ($ver) ==="
          # -p:WindowsRid scopes the RID + self-contained to the Windows TFM (see csproj):
          # passing -r/--self-contained globally leaks onto the android TFM during restore
          # and fails resolving a nonexistent Mono.win-x64 runtime pack.
          dotnet publish UdapEdAppMaui/UdapEdAppMaui.csproj `
            -f net10.0-windows10.0.19041.0 -c Release `
            -p:WindowsRid=$rid `
            -p:WindowsPackageType=None -p:Version=$ver `
            -o "publish/$rid"
          if ($LASTEXITCODE -ne 0) { throw "publish failed for $rid" }

          Write-Host "=== Packing $rid ($ver) ==="
          vpk pack `
            --packId UdapEd `
            --packVersion $ver `
            --packTitle UdapEd `
            --packDir "publish/$rid" `
            --mainExe UdapEdAppMaui.exe `
            --runtime $rid `
            --channel $rid `
            -o releases
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed for $rid" }
        }

        # Only publish the installers + auto-update feed; drop the portable zips
        # (vpk always emits them and has no flag to skip).
        Remove-Item releases/*-Portable.zip -ErrorAction SilentlyContinue

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-installers
        path: releases/*
        if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS desktop (MacCatalyst) -> universal .dmg, Tier 1 (ad-hoc signed, no
  # Apple Developer account required). Independent of the Windows build.
  # Uploads the .dmg as a CI artifact (no Release yet).
  # ---------------------------------------------------------------------------
  build-macos:
    # macos-26 carries the Xcode 26.x/27.x releases the .NET 10 MacCatalyst workload needs.
    # macos-latest is still macOS 15 and tops out at Xcode 16.4 (NETSDK error).
    needs: classify-tag
    if: needs.classify-tag.outputs.desktop == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.classify-tag.outputs.version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Pin the .NET 10 SDK
      # macos-26 also ships the .NET 11 SDK. Without a valid pin, `dotnet workload
      # install maui` runs under SDK 11 and installs that SDK's workload packs.
      shell: bash
      run: |
        sdk=$(dotnet --list-sdks | awk '/^10\./{print $1}' | tail -n1)
        echo "Pinning SDK $sdk"
        dotnet new globaljson --sdk-version "$sdk" --force

    - name: Install .NET MAUI workload
      # Pinned: workload sets after 10.0.401 ship MacCatalyst 27.x, which needs Xcode 27.x,
      # and the macos-26 image tops out at Xcode 26.6. 10.0.401 carries MacCatalyst
      # 26.5.10318 (Xcode 26.5). Raise this (here and in the next step) once the image
      # ships Xcode 27.
      run: dotnet workload install maui --version "$MAUI_WORKLOAD_VERSION"
      env:
        MAUI_WORKLOAD_VERSION: '10.0.401'

    - name: Select the Xcode the MacCatalyst workload requires
      # Each MacCatalyst SDK version requires the Xcode with the same major.minor
      # (26.5.x needs Xcode 26.5). Read it from the pinned workload set's manifest list,
      # not from the packs folder: the runner image ships other packs (e.g. 27.2) too.
      env:
        MAUI_WORKLOAD_VERSION: '10.0.401'
      run: |
        sdkver=$(dotnet workload search version "$MAUI_WORKLOAD_VERSION" --format json \
          | grep -io '"microsoft.net.sdk.maccatalyst"[^,}]*' | sed -E 's/.*: *"([0-9.]+)\/.*/\1/')
        if [ -z "$sdkver" ]; then echo "Could not read the MacCatalyst version of workload set $MAUI_WORKLOAD_VERSION"; exit 1; fi
        xcode=$(echo "$sdkver" | cut -d. -f1,2)
        app="/Applications/Xcode_$xcode.app"
        echo "Workload set $MAUI_WORKLOAD_VERSION has MacCatalyst $sdkver, which requires Xcode $xcode"
        if [ ! -d "$app" ]; then
          echo "Xcode $xcode is not installed on this runner. Installed:"
          ls -d /Applications/Xcode_*.app
          exit 1
        fi
        sudo xcode-select -s "$app"
        echo "MD_APPLE_SDK_ROOT=$app" >> "$GITHUB_ENV"
        xcodebuild -version

    - name: Publish MacCatalyst (universal, unsigned)
      run: |
        ver="$VERSION"
        # Override the csproj's Apple Development signing + hardened runtime so no
        # Apple secrets are needed and an ad-hoc signature can launch (Tier 1).
        # Do NOT pass RuntimeIdentifiers: in Release config MAUI already defaults
        # MacCatalyst to a universal x64+arm64 build, applied locally to this app.
        # Passing it globally leaks onto the referenced Shared project, which rejects
        # the two-RID string as a single unrecognized RID (NETSDK1083).
        dotnet publish UdapEdAppMaui/UdapEdAppMaui.csproj \
          -f net10.0-maccatalyst -c Release \
          -p:CreatePackage=false \
          -p:EnableCodeSigning=false \
          -p:UseHardenedRuntime=false \
          -p:CodesignKey= \
          -p:CodesignProvision= \
          -p:Version=$ver

    - name: Ad-hoc sign and package .dmg
      run: |
        ver="$VERSION"
        app=$(find UdapEdAppMaui/bin/Release/net10.0-maccatalyst -maxdepth 3 -name '*.app' | head -n 1)
        if [ -z "$app" ]; then echo "No .app produced"; exit 1; fi
        echo "Found app bundle: $app"
        codesign --force --deep --sign - "$app"
        brew install create-dmg
        create-dmg \
          --volname "UdapEd" \
          --app-drop-link 450 160 \
          --icon "$(basename "$app")" 150 160 \
          "UdapEd-$ver.dmg" "$app" \
        || hdiutil create -volname "UdapEd" -srcfolder "$app" -ov -format UDZO "UdapEd-$ver.dmg"

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: UdapEd-*.dmg
        if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Assemble one GitHub Release from the desktop artifacts. Runs after both
  # desktop builds so neither depends on the other; either failing means no
  # Release is published (re-tag after the fix). Skipped automatically for
  # 4-part tags, since both desktop jobs are skipped.
  # ---------------------------------------------------------------------------
  publish-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]

    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: dist/**/*
