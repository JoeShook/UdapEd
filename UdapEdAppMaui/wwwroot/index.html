<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>UdapEd</title>
  <base href="/" />
  <script>
    // Paint the saved dark theme before the app loads; MainLayout applies the full theme once Blazor starts.
    try { if (localStorage.getItem('udaped-theme') === 'dark') { document.documentElement.style.colorScheme = 'dark'; document.documentElement.style.background = '#121B23'; } } catch (e) { }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
  <link href="_content/UdapEd.Shared/css/app.css" rel="stylesheet" />
  <link href="_content/UdapEd.Shared/css/cds.css" rel="stylesheet" asp-append-version="true" />
  <link rel="stylesheet" href="_content/UdapEd.Shared/css/app.css" />
  <link rel="stylesheet" href="_content/UdapEd.Shared/css/cds.css" />
  <!-- <link rel="stylesheet" href="UdapEdAppMaui.styles.css" /> -->
  <link rel="icon" href="_content/UdapEd.Shared/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/svg+xml" href="_content/UdapEd.Shared/favicon.svg" />
  <link rel="apple-touch-icon" href="_content/UdapEd.Shared/apple-touch-icon.png" />
</head>

<body>

  <div class="status-bar-safe-area"></div>

  <div id="app">Loading...</div>

  <div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="" class="reload">Reload</a>
    <a class="dismiss">🗙</a>
  </div>

  <script src="_framework/blazor.webview.js" autostart="false"></script>
  <script src="_content/MudBlazor/MudBlazor.min.js" asp-append-version="true"></script>
  <script src="_content/UdapEd.Shared/scripts/AutoFocus.js"></script>
  <script src="_content/UdapEd.Shared/scripts/UdapEdUtility.js?v=3"></script>
  <script src="_content/UdapEd.Shared/scripts/EventHandlers.js"></script>

  <script src="_content/BlazorMonaco/jsInterop.js"></script>
  <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
  <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>

  <!-- todo package in RCL -->
  <script type="text/javascript">
    function setMonacoEditorResize(id) {
      window.onresize = () => { blazorMonaco.editor.layout(id, 0); }
    }
    function scrollElementIntoView(id) {
      document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
    }
    function getElementHeight(element) {
      return element ? element.offsetHeight : 400;
    }
  </script>
</body>

</html>
