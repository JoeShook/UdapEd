<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="UdapEd">
  <title>UdapEd</title>
  <!-- UdapEd app icon.
       A trust chain bent into a "U": the filled node is the trust anchor, the open ring is the
       leaf certificate, and the unbroken path between them is the validated chain.
       The hairline frame is the certificate border. 64-unit grid; content sits inside the
       maskable safe zone (radius 25.6 around the centre). -->
  <rect width="64" height="64" rx="14" fill="#152A38"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="11" fill="none" stroke="#5CB8CC" stroke-opacity=".32" stroke-width=".75"/>
  <path d="M20 24V37a12 12 0 0 0 24 0V24" fill="none" stroke="#EEF3F6" stroke-width="6"/>
  <circle cx="20" cy="18" r="6" fill="#5CB8CC"/>
  <circle cx="44" cy="18" r="4.5" fill="none" stroke="#EEF3F6" stroke-width="3"/>
</svg>
